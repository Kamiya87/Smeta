<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sheet">
    <header class="page-header">
      <div>
        <h1>Смета</h1>
        <p>Добавьте позиции и укажите условия расчёта.</p>
      </div>
      <button id="print-button" class="secondary print-button" type="button">Сохранить PDF</button>
    </header>

    <section class="document-details" aria-labelledby="details-heading">
      <h2 id="details-heading">Данные сметы</h2>
      <div class="document-fields">
        <label for="estimate-number">Номер сметы
          <input id="estimate-number" type="text" autocomplete="off" value="1">
        </label>
        <label for="estimate-date">Дата
          <input id="estimate-date" type="date">
        </label>
        <label for="supplier-details">Реквизиты исполнителя
          <textarea id="supplier-details" rows="3" placeholder="Название, адрес, ИИН/БИН, контакты"></textarea>
        </label>
        <label for="customer-details">Реквизиты заказчика
          <textarea id="customer-details" rows="3" placeholder="Название, адрес, ИИН/БИН, контакты"></textarea>
        </label>
      </div>
    </section>

    <section class="print-document-header" aria-label="Реквизиты сметы">
      <h1 id="print-title">Смета № 1</h1>
      <div class="print-parties">
        <div><strong>Исполнитель</strong><div id="print-supplier"></div></div>
        <div><strong>Заказчик</strong><div id="print-customer"></div></div>
      </div>
    </section>

    <section aria-labelledby="items-heading">
      <h2 id="items-heading">Позиции</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Наименование</th>
              <th scope="col">Количество</th>
              <th scope="col">Цена</th>
              <th scope="col">Сумма</th>
              <th scope="col"><span class="visually-hidden">Действия</span></th>
            </tr>
          </thead>
          <tbody id="items-body"></tbody>
        </table>
      </div>
      <button id="add-button" class="secondary add-button" type="button">+ Добавить позицию</button>
    </section>

    <section class="calculation" aria-labelledby="calculation-heading">
      <h2 id="calculation-heading">Расчёт</h2>
      <div class="settings">
        <label for="discount">Скидка, %
          <input id="discount" type="text" inputmode="decimal" value="0" autocomplete="off">
        </label>
        <label for="vat">НДС, %
          <input id="vat" type="text" inputmode="decimal" value="0" autocomplete="off">
        </label>
        <label for="currency">Валюта
          <select id="currency">
            <option value="₸">₸</option>
            <option value="₽">₽</option>
            <option value="$">$</option>
            <option value="€">€</option>
          </select>
        </label>
      </div>
      <dl class="summary" aria-label="Итоговый расчёт">
        <div class="summary-row"><dt>Сумма</dt><dd id="subtotal">0 ₸</dd></div>
        <div class="summary-row" id="discount-row" hidden><dt>Скидка</dt><dd id="discount-amount">0 ₸</dd></div>
        <div class="summary-row" id="discounted-row" hidden><dt>Сумма со скидкой</dt><dd id="discounted-total">0 ₸</dd></div>
        <div class="summary-row" id="vat-row" hidden><dt>НДС</dt><dd id="vat-amount">0 ₸</dd></div>
        <div class="summary-row grand-total"><dt>Итого к оплате</dt><dd id="grand-total">0 ₸</dd></div>
      </dl>
    </section>

    <section class="comment-section" aria-labelledby="comment-heading">
      <h2 id="comment-heading">Комментарий</h2>
      <label class="visually-hidden" for="comment">Комментарий: сроки и условия оплаты</label>
      <textarea id="comment" rows="4" placeholder="Сроки выполнения, условия оплаты и другие примечания"></textarea>
      <div id="print-comment" class="print-comment"></div>
    </section>
    <p class="print-signature">Подпись ____________________</p>
  </main>
</body>
</html>
